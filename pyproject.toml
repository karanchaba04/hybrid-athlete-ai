[project]
name = "hybrid-athlete-ai"
version = "0.1.0"
description = "Personal training OS — unify fragmented athlete data and power an AI coach"
readme = "README.md"
authors = [
    { name = "Karan Chaba", email = "karanchaba04@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
hybrid-athlete-ai = "hybrid_athlete_ai:main"
hybrid-athlete-mcp = "hybrid_athlete_ai.mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
